<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look 4: Unit 6 – L1 Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B4F; --ink-soft:#5A6788;
  --paper:#F2F7FF; --grid:#DFEAFB; --card:#FFFFFF; --line:#D4E0F3;
  --sun:#FFC93C; --sun-deep:#D9A112;
  --grass:#25A96A; --grass-deep:#1A7F4F;
  --berry:#E5484D; --berry-deep:#B32F34;
  --c-sunglasses:#A8741A; --c-stripes:#CF3A3A; --c-sneakers:#4C5C6B; --c-polka:#1B93C2; --c-leggings:#D6358B;
  --c-pocket:#2F5FB0; --c-plain:#8C7A68; --c-comfortable:#5E9B34; --c-bracelets:#7A4FB5;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; min-height:100dvh; -webkit-tap-highlight-color:transparent; overflow-x:clip;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px clamp(16px,4vw,40px)}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{width:52px;height:52px;border-radius:16px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);display:grid;place-items:center;flex:none}
.brand-badge svg{width:30px;height:30px}
.brand small{display:block;font-weight:800;color:var(--ink-soft);font-size:.9rem;letter-spacing:.01em}
.brand h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.1}
.tabs{display:flex;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:999px;padding:5px;gap:4px}
.tab{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;padding:10px 20px;border-radius:999px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1630}
.tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--paper)}
main{padding:0 clamp(16px,4vw,40px) 32px;overflow:clip}
.view[hidden]{display:none}

/* chunky buttons */
.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .2s,opacity .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.is-on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #0E1630}
.btn.is-disabled{opacity:.5;cursor:not-allowed;box-shadow:0 4px 0 var(--line)}
.btn.is-disabled:active{transform:none}
.btn.shake{animation:shake .4s}
.btn-primary{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);font-size:1.2rem;padding:14px 28px}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-icon{padding:11px;border-radius:50%}
.sound-toggle{position:fixed;right:18px;bottom:18px;z-index:10;background:#fff}

/* photos */
.ph{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:cover;border-radius:16px;pointer-events:none;user-select:none}

/* flashcards */
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px 18px;flex-wrap:wrap;margin:4px auto 12px}
.tgroup{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.tgroup.tools{background:var(--grid);border-radius:999px;padding:6px 8px}
.hint{color:var(--ink-soft);font-weight:800;text-align:center;min-height:1.6em;margin:0 0 14px;font-size:1rem;transition:color .2s}
.hint.good{color:var(--grass-deep);font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem}

/* the left lane is always reserved, so the cards never move when the word box comes and goes */
.layout{position:relative;display:grid;grid-template-columns:192px minmax(0,1fr) 34px;column-gap:22px;justify-items:center;align-items:start}
.layout .wbox-l{grid-column:1;grid-row:1;justify-self:center;align-self:center}
.layout .deck{grid-column:2;grid-row:1}

/* the word box: one tray on the left, two columns of words */
.wbox{position:relative;display:flex;flex-direction:column;gap:clamp(8px,1.4dvh,14px);background:var(--grid);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:26px;padding:24px 14px 18px}
.wbox[hidden]{display:none}
.wbox-l{animation:slideL .22s ease-out both}
@keyframes slideL{from{opacity:0;transform:translateX(-30px)}}
@keyframes flowDown{from{opacity:0;transform:translateY(-14px)}}
.wbox-tag{position:absolute;left:50%;top:-15px;transform:translateX(-50%);white-space:nowrap}
.wb{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;min-width:158px;padding:clamp(6px,1.2dvh,10px) 14px;border-radius:16px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:center;line-height:1.15;transition:transform .1s,box-shadow .1s,background .2s,color .2s,opacity .2s}
.wb:hover{border-color:var(--ink-soft)}
.wb:active{cursor:grabbing}
.wb.sel{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 8px 0 #0E1630;transform:translateY(-3px)}
.wb.used{opacity:.3;box-shadow:none;border-style:dashed;cursor:default;transform:none}
.wb.dragging{opacity:.3}
.wb.shake{animation:shake .4s;border-color:var(--berry)}
.wbox.intro .wb{animation:chipIn .2s ease-out both;animation-delay:calc(var(--n) * 18ms + 40ms)}
@keyframes chipIn{from{opacity:0;transform:translateX(-16px)}}
.wb.ghost.fly{transition:transform .26s cubic-bezier(.25,.8,.3,1),opacity .26s;box-shadow:0 6px 0 var(--ink)}
.wb.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-color:var(--ink);box-shadow:0 10px 0 var(--ink);cursor:grabbing;transition:none;opacity:1}

.deck{--w:min(1260px,calc(((100dvh - 350px) / 1.6) * 5 + 64px));width:min(100%,var(--w));display:grid;grid-template-columns:repeat(10,1fr);gap:16px}
.fcw{display:flex;flex-direction:column;min-width:0;grid-column:span 2}
.fcw:nth-child(6){grid-column:2 / span 2}
.fc{perspective:1200px;aspect-ratio:5/4;position:relative;width:100%;transition:transform .15s}
.fc:hover{transform:translateY(-5px)}
.deck.dealing .fcw{animation:deal .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.fc.is-word .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.face-pic{background:var(--card);border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,white)}
.face-pic .ph{inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);border-radius:19px}
.face-word{transform:rotateY(180deg);background:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff;container-type:inline-size}
.face-word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(14cqw,4rem);letter-spacing:.01em;text-align:center;line-height:1.05;padding:0 10px;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.avatar{position:absolute;left:12px;top:12px;width:clamp(36px,22%,56px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);pointer-events:none}
.speak{position:absolute;right:10px;bottom:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;color:#fff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s,visibility 0s}
.fc.is-word .speak{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s .3s,visibility 0s .3s}
.speak:hover{background:rgba(255,255,255,.42)}
.speak:active{transform:translateY(2px)}
.speak svg{width:21px;height:21px}
.num-badge{position:absolute;top:-11px;right:-9px;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #0E1630;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.2rem;line-height:1;pointer-events:none;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}
.deck.blanks .num-badge{opacity:1;transform:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);transition-delay:calc(var(--i) * 22ms + 60ms)}
.fc button.flip{position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}

/* blanks under the pictures (only with the word box) */
.slot{position:relative;display:block;width:100%;height:46px;margin-top:14px;opacity:0;visibility:hidden;border:3px dashed var(--ink-soft);border-radius:14px;background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--paper) 12px 24px);container-type:inline-size;color:#fff;transition:opacity .2s,transform .1s,box-shadow .1s,visibility 0s .2s}
.deck.blanks .slot{opacity:1;visibility:visible;transition-delay:0s}
.deck.blanks .slot:not(.filled):not(.wrong){animation:flowDown .2s ease-out both;animation-delay:calc(var(--i) * 22ms + 60ms)}
.slot span{display:block;font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(11cqw,1.4rem);line-height:40px;white-space:nowrap;text-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,black)}
.slot.armed{border-style:solid;border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 14%,transparent)}
.slot.hover{border-style:solid;border-color:var(--ink);background:#fff;transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}
.slot.wrong{border-style:solid;border-color:var(--berry);background:#FDECEC;animation:shake .4s}
.slot.filled{border-style:solid;border-color:var(--c);background:var(--c);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

/* game shared */
.game{width:min(100%,980px);margin:0 auto}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.round-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;display:flex;align-items:center;gap:12px}
.chip{font-weight:800;font-size:.9rem;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .25s}
.dot.word{border-radius:4px}
.dot.cur{border-color:var(--ink);transform:scale(1.25)}
.dot.ok{background:var(--grass);border-color:var(--grass)}
.dot.no{background:var(--berry);border-color:var(--berry)}
.score{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.score svg{width:26px;height:26px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.stage-wrap{position:relative}
/* 9 tiles: 5 on the first row, 4 centred on the second */
.stage{--w:min(1100px,max(520px,calc((100dvh - 470px) * 2.5 + 24px)));width:min(100%,var(--w));margin:0 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:16px}
.stage .tile{grid-column:span 2}
.stage .tile:nth-child(6){grid-column:2 / span 2}
.tile{aspect-ratio:1/1;border-radius:22px;display:grid;place-items:center;position:relative;background:#fff;border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,white)}
.tile .ph{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:15px}
.tile.word{background:var(--c);border-color:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff;container-type:inline-size}
.tile.word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(15cqw,3rem);text-align:center;line-height:1.05;padding:0 6px;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.tile.missing{background:repeating-linear-gradient(-45deg,#fff 0 14px,var(--paper) 14px 28px);border:3px dashed var(--ink-soft);box-shadow:none}
.tile.missing b{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3rem,8vw,6rem);line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.tile.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tile.reveal::after{content:"";position:absolute;inset:-9px;border-radius:28px;border:4px solid var(--grass);pointer-events:none}
.tile.reveal.wrong::after{border-color:var(--berry)}
.stage.dealing .tile{animation:deal .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.9)}}
.curtain{position:absolute;inset:-12px;border-radius:30px;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;z-index:5;transform:scaleY(0);transform-origin:top;transition:transform .45s cubic-bezier(.6,0,.3,1);pointer-events:none}
.curtain.down{transform:scaleY(1);pointer-events:auto}
.curtain-inner{opacity:0;transition:opacity .2s}
.curtain.down .curtain-inner{opacity:1;transition-delay:.3s}
.curtain svg{width:120px;height:60px;margin-bottom:10px}
.curtain p{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,3rem)}
.curtain .count{font-family:"Fredoka",sans-serif;font-size:1.4rem;opacity:.75;margin-top:6px}
.panel{margin-top:26px;text-align:center;min-height:170px}
.question{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin-bottom:14px}
.look-copy{color:var(--ink-soft);font-weight:700;font-size:1.1rem;margin-bottom:16px}
.options{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.opt{background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:20px;position:relative;transition:transform .08s,box-shadow .08s,border-color .2s}
.opt:hover{border-color:var(--ink-soft)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.pic{width:clamp(88px,12dvh,120px);aspect-ratio:1/1;display:grid;place-items:center}
.opt.pic .ph{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:14px}
.opt.txt{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2rem);padding:16px 34px;min-width:150px}
.opt .key{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Nunito",sans-serif;font-weight:800;font-size:.85rem;display:grid;place-items:center;z-index:2}
.opt.ok{border-color:var(--grass);box-shadow:0 6px 0 var(--grass-deep);background:#E6F7EE}
.opt.no{border-color:var(--berry);box-shadow:0 6px 0 var(--berry-deep);background:#FDECEC;animation:shake .4s}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.no){opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;margin:18px 0 12px;min-height:1.7em;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.feedback .btn{color:var(--ink)}
.feedback.good{color:var(--grass-deep)}
.feedback.bad{color:var(--berry-deep)}

/* end screen */
.result{position:relative;width:min(100%,560px);margin:30px auto 0;background:#fff;border-radius:32px;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);padding:40px 28px;text-align:center}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.stars svg{width:62px;height:62px}
.stars svg:nth-child(2){transform:translateY(-14px);width:76px;height:76px}
.stars .on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.15s}
.stars .on:nth-child(3){animation-delay:.3s}
.result h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.4rem}
.result p{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:6px 0 26px}
.result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* confetti */
.confetti{position:absolute;width:0;height:0;pointer-events:none;z-index:8}
.confetti i{position:absolute;left:0;top:0;width:10px;height:15px;border-radius:3px;background:var(--k);animation:fly .95s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d)}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}

/* Guess it! */
.gz-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;justify-content:center;margin:0 auto;max-width:900px;padding-bottom:6px}
.mystery{width:clamp(190px,calc(100dvh - 500px),300px)}
.mystery .cap{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);z-index:3;background:var(--c);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.25rem;padding:6px 20px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);white-space:nowrap}
.clue-card{position:relative;text-align:left;background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);border-radius:var(--r-lg);padding:22px 76px 24px 28px}
.clue-card::before{content:"";position:absolute;left:-13px;top:50%;width:22px;height:22px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.clue-card .chip{margin-bottom:12px}
.clue-text{font-weight:800;font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.35;margin-bottom:10px}
.clue-q{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.15}
.say-clue{position:absolute;top:16px;right:16px}

/* Fill the gap */
.gap{width:min(100%,980px);margin:0 auto}
.nw{white-space:nowrap}
.bank{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--grid);border-radius:22px;padding:14px 20px;margin-bottom:22px}
.bank-label{font-weight:800;color:var(--ink-soft);font-size:.95rem;margin-right:4px}
.wchip{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);padding:10px 26px;border-radius:16px;background:#fff;border:3px solid color-mix(in srgb,var(--c) 40%,white);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,white);transition:transform .1s,box-shadow .1s,background .2s,color .2s}
.wchip:hover{border-color:var(--c)}
.wchip:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 40%,white)}
.wchip.sel{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 8px 0 color-mix(in srgb,var(--c) 70%,black);transform:translateY(-3px)}
.wchip.used{opacity:.3;box-shadow:none;border-style:dashed;cursor:default;transform:none}
.sheet{display:grid;gap:16px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) 64px;align-items:center;gap:16px;padding:12px 20px;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:24px;transition:border-color .3s,box-shadow .3s}
.srow.done{border-color:color-mix(in srgb,var(--c) 45%,white);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,white)}
.srow.done .num{background:var(--c)}
.num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;display:grid;place-items:center;transition:background .3s}
.stext{font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(1.1rem,1.95vw,1.5rem);line-height:2.1}
.blank{position:relative;line-height:1;display:inline-block;vertical-align:middle;min-width:min(172px,42vw);height:54px;margin:0 4px;border-radius:14px;border:3px dashed var(--ink-soft);background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--paper) 12px 24px);font-family:"Fredoka",sans-serif;font-weight:700;font-size:inherit;color:#fff;padding:0 12px;transition:transform .1s,box-shadow .1s}
.blank.active{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transform:translateY(-2px)}
.blank.filled{background:var(--c);border:3px solid var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .45s cubic-bezier(.3,1.6,.5,1);cursor:default}
.blank.wrongfill{background:var(--berry);border:3px solid var(--berry);box-shadow:0 5px 0 var(--berry-deep);animation:shake .4s}
.thumb{width:64px;height:64px}
.thumb img{display:block;width:64px;height:64px;object-fit:cover;border-radius:16px;border:3px solid var(--c);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* short windows (laptop + projector with browser toolbars): tighten vertical space so nothing scrolls */
@media (min-width:641px) and (max-height:780px){
  .top{padding-top:12px;padding-bottom:10px}
  .brand-badge{width:46px;height:46px;border-radius:14px}
  .gbar{margin-bottom:12px}
  .stage{--w:min(1100px,max(440px,calc((100dvh - 440px) * 2.5 + 24px)))}
  .panel{margin-top:16px;min-height:0}
  .question{margin-bottom:10px}
  .look-copy{margin-bottom:10px}
  .feedback{margin:12px 0 4px}
  .opt.pic{width:clamp(72px,11dvh,100px)}
  .opt.txt{padding:12px 30px}
  .mystery{width:clamp(150px,calc(100dvh - 470px),260px)}
  .clue-card{padding-top:16px;padding-bottom:18px}
  .bank{padding:10px 20px;margin-bottom:14px}
  .wchip{padding:7px 24px}
  .sheet{gap:11px}
  .srow{padding:7px 20px}
  .blank{height:46px}
  .num{width:34px;height:34px}
  .thumb,.thumb img{width:54px;height:54px}
  .srow{grid-template-columns:auto minmax(0,1fr) 54px}
  .toolbar{margin-bottom:8px;gap:8px 14px}
  .toolbar .btn{padding:8px 16px}
  .tgroup.tools{padding:4px 6px}
  .hint{margin-bottom:8px;min-height:1.4em}
  .deck{gap:14px}
  .slot{height:40px;margin-top:10px}
  .slot span{line-height:34px}
  .num-badge{width:34px;height:34px;font-size:1.05rem;top:-10px;right:-8px}
  .wbox{gap:7px;padding:20px 12px 12px}
  .wb{padding:5px 12px;font-size:1.05rem;border-width:2px;box-shadow:0 4px 0 var(--line)}
  .deck{--w:min(1260px,calc(((100dvh - 320px) / 1.6) * 5 + 64px))}
  .hint.good{font-size:1rem}
}
@media (max-width:760px){
  .gz-stage{grid-template-columns:1fr;justify-items:center;gap:26px}
  .clue-card::before{left:50%;top:-13px;border-bottom:0;border-top:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  .mystery{width:clamp(150px,34dvh,230px)}
  .clue-card{padding:18px 64px 20px 20px;width:100%}
}
@media (max-width:640px){
  .deck{grid-template-columns:repeat(2,1fr);gap:14px;--w:100%}
  .fcw,.fcw:nth-child(6){grid-column:auto}
  .fcw:nth-child(9){grid-column:1 / -1;justify-self:center;width:calc(50% - 7px)}
  .num-badge{width:32px;height:32px;font-size:1rem}
  .layout{grid-template-columns:minmax(0,1fr);row-gap:22px}
  .layout .wbox-l{grid-column:1;grid-row:1;justify-self:stretch;align-self:start}
  .layout .deck{grid-column:1;grid-row:2}
  .slot{height:0;margin-top:0;border-width:0}
  .deck.blanks .slot{height:44px;margin-top:10px;border-width:3px}
  .wbox{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;padding:22px 12px 14px;width:100%}
  .wb{min-width:0;padding:8px 14px}
  .tgroup.tools{border-radius:26px}
  .tab span{display:none} .tab{padding:10px 16px}
  .stage{gap:12px;grid-template-columns:repeat(3,1fr)} .tile{border-radius:16px}
  .stage .tile,.stage .tile:nth-child(6){grid-column:auto}
  .opt.txt{padding:12px 22px;min-width:110px}
  .options{gap:14px}
  .srow{grid-template-columns:auto minmax(0,1fr);gap:12px}
  .thumb{display:none}
  .srow{padding:10px 14px}
  main{padding-bottom:92px}
  .sound-toggle{right:12px;bottom:12px;width:44px;height:44px;padding:0;display:grid;place-items:center}
  .panel{margin-top:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1E2B4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5.7 1.5 1.5z"/></svg>
    </div>
    <div><small>Look 4</small><h1>Unit 6 – L1 Words</h1></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Activities">
    <button class="tab" role="tab" data-view="cards" aria-selected="true" aria-label="Flashcards"><i data-ic="pic"></i><span>Flashcards</span></button>
    <button class="tab" role="tab" data-view="guess" aria-selected="false" aria-label="Guess it!"><i data-ic="bulb"></i><span>Guess it!</span></button>
    <button class="tab" role="tab" data-view="gap" aria-selected="false" aria-label="Fill the gap"><i data-ic="pencil"></i><span>Fill the gap</span></button>
    <button class="tab" role="tab" data-view="wm" aria-selected="false" aria-label="What's missing?"><i data-ic="eye"></i><span>What's missing?</span></button>
  </nav>
</header>

<main>
  <section class="view" id="view-cards">
    <div class="toolbar">
      <div class="tgroup">
        <button class="btn is-on" id="b-pics"><i data-ic="pic"></i>Show all pictures</button>
        <button class="btn" id="b-words"><i data-ic="words"></i>Show all words</button>
        <button class="btn" id="b-shuffle"><i data-ic="shuffle"></i>Shuffle</button>
      </div>
      <div class="tgroup tools">
        <button class="btn" id="b-box" aria-pressed="false"><i data-ic="box"></i><span class="lbl">Show word box</span></button>
        <button class="btn" id="b-reset" hidden><i data-ic="replay"></i>Start again</button>
      </div>
    </div>
    <p class="hint" id="hint" aria-live="polite">Tap a card to flip it</p>
    <div class="layout" id="layout">
      <aside class="wbox wbox-l" id="wbox-l" aria-label="Word box" hidden></aside>
      <div class="deck" id="deck"></div>
    </div>
  </section>

  <section class="view" id="view-guess" hidden><div class="game" id="guess-root"></div></section>
  <section class="view" id="view-gap" hidden><div class="gap" id="gap-root"></div></section>
  <section class="view" id="view-wm" hidden><div class="game" id="wm-root"></div></section>
</main>

<button class="btn btn-icon sound-toggle" id="sound" aria-label="Sound on" aria-pressed="true"></button>

/* ---------- sound ---------- */
let soundOn=true, actx=null;
function tone(freqs,dur=.12,type="sine",vol=.18){ if(!soundOn) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.85;});}catch(e){} }
const sfx={flip:()=>tone([660],.08,"triangle",.12), good:()=>tone([523,659,784,1047],.13,"triangle",.2),
  bad:()=>tone([300,220],.18,"sawtooth",.08), whoosh:()=>tone([440,330,262],.1,"sine",.12)};
function say(word){ if(!soundOn||!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word); u.lang="en-US"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
const soundBtn=$('#sound');
function paintSound(){ soundBtn.innerHTML=ic(soundOn?'speaker':'mute'); soundBtn.setAttribute('aria-pressed',soundOn); soundBtn.setAttribute('aria-label',soundOn?'Sound on':'Sound off'); }
soundBtn.onclick=()=>{ soundOn=!soundOn; if(!soundOn&&"speechSynthesis" in window) try{speechSynthesis.cancel()}catch(e){} paintSound(); sfx.flip(); };
paintSound();

/* ---------- spaced sequences ---------- */
function spacedSeq(items,rounds,gap,avoid=()=>false){ const seq=[],used=new Map(items.map(i=>[i,0]));
  for(let r=0;r<rounds;r++){ const recent=seq.slice(-gap), prev=seq[seq.length-1];
    let pool=items.filter(i=>!recent.includes(i));
    const min=Math.min(...pool.map(i=>used.get(i))); pool=pool.filter(i=>used.get(i)===min);
    const far=pool.filter(i=>prev===undefined||!avoid(i,prev)); if(far.length) pool=far;
    const pick=pool[Math.random()*pool.length|0]; seq.push(pick); used.set(pick,used.get(pick)+1);} return seq; }

/* ---------- results card ---------- */
function starCount(got,total){ return got>=total-1?3:got>=Math.ceil(total*.6)?2:got>=Math.ceil(total*.3)?1:0; }
function showResult(root,{got,total,sub,perfect,again}){
  const n=starCount(got,total), head=[ 'Nice try!','Good work!','Super!',perfect ][n];
  root.innerHTML=`<div class="result">
    <div class="stars">${[0,1,2].map(i=>i<n?STAR.replace('<svg','<svg class="on"'):STAR_OFF).join('')}</div>
    <h2>${head}</h2><p>${sub}</p>
    <div class="row"><button class="btn btn-primary" id="r-again">${ic('replay')}Play again</button><button class="btn" id="r-back">${ic('pic')}Back to flashcards</button></div></div>`;
  if(n===3){ sfx.good(); burst($('.result',root),'#7A4FB5',34,'22%'); }
  $('#r-again',root).onclick=again; $('#r-back',root).onclick=()=>show('cards');
  $('#r-again',root).focus();
}
function burst(host,color,n=18,top='50%'){
  if(!host||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const c=document.createElement('div'); c.className='confetti'; c.style.left='50%'; c.style.top=top;
  const cols=['#FFC93C','#25A96A',color,'#1E2B4F','#FFC93C',color];
  const r=host.getBoundingClientRect(), cx=r.left+r.width/2, lo=14-cx, hi=innerWidth-14-cx;   // keep pieces inside the screen
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, d=70+Math.random()*100, el=document.createElement('i');
    el.style.cssText=`--k:${cols[i%cols.length]};--x:${Math.min(hi,Math.max(lo,Math.cos(a)*d)).toFixed(0)}px;--y:${(Math.sin(a)*d-30).toFixed(0)}px;--r:${(Math.random()*720-360)|0}deg;--d:${(Math.random()*90)|0}ms`;
    c.appendChild(el); }
  host.appendChild(c); setTimeout(()=>c.remove(),1300);
}
function bumpScore(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
const dotsHTML=(n,cur,res,kinds)=>`<div class="dots">${Array.from({length:n},(_,k)=>`<span class="dot${kinds&&kinds[k]==='word'?' word':''}${k===cur?' cur':''}${res[k]===true?' ok':''}${res[k]===false?' no':''}"></span>`).join('')}</div>`;

/* ---------- tabs ---------- */
const tabs=$$('.tab'), views={cards:$('#view-cards'),guess:$('#view-guess'),gap:$('#view-gap'),wm:$('#view-wm')};
let curView='cards';
function show(id){
  curView=id;
  tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.view===id));
  Object.entries(views).forEach(([k,v])=>v.hidden=k!==id);
  if(id==='guess'&&!guess.started) guessStart();
  if(id==='gap'&&!gap.started) gapStart();

/* ---------- 2. Guess it! ---------- */
const SING={stripes:'a stripe',polka:'a polka dot',sneakers:'a sneaker',bracelets:'a bracelet',pocket:'a pocket'};
/* every riddle has one answer and a pool of safe wrong answers (checked one by one: none of them fits the clue) */
const G=[
 {clue:"You wear them on your face when it is sunny.",q:"What are they?",lead:"They're",
  ans:'sunglasses',pool:['bracelets','sneakers','leggings','stripes']},
 {clue:"A zebra has black and white ones.",q:"What are they?",lead:"They're",
  ans:'stripes',pool:['polka','bracelets','sunglasses','sneakers']},
 {clue:"You wear them on your feet to run and play.",q:"What are they?",lead:"They're",
  ans:'sneakers',pool:['leggings','sunglasses','bracelets','stripes']},
 {clue:"They are small and round. A ladybug has black ones.",q:"What are they?",lead:"They're",
  ans:'polka',pool:['stripes','leggings','sneakers','sunglasses']},
 {clue:"They are stretchy pants. You can wear them to dance.",q:"What are they?",lead:"They're",
  ans:'leggings',pool:['sneakers','bracelets','sunglasses','stripes']},
 {clue:"It is part of your pants. You can put coins in it.",q:"What is it?",lead:"It's",
  ans:'pocket',pool:['stripes','bracelets','sneakers','polka'],single:true},
 {clue:"This word means one color, with no patterns.",q:"What is the word?",lead:"The word is",
  ans:'plain',pool:['stripes','polka','comfortable']},
 {clue:"This word means soft and nice, like a big warm bed.",q:"What is the word?",lead:"The word is",
  ans:'comfortable',pool:['plain','pocket','stripes','polka']},
 {clue:"You wear them around your wrist.",q:"What are they?",lead:"They're",
  ans:'bracelets',pool:['sunglasses','leggings','sneakers','polka']}
];
const guess={i:0,score:0,res:[],started:false,locked:false,qs:[]};
const gRoot=$('#guess-root');
function guessStart(){
  guess.i=0; guess.score=0; guess.res=[]; guess.started=true;
  const n=G.length, pos=spacedSeq([0,1,2],n,1);   // where the right answer sits: balanced, never the same slot twice in a row
  const use=Object.fromEntries(IDS.map(i=>[i,0]));   // how often a word has been used as a wrong answer: keep it even
  guess.qs=shuffle(G).map((q,i)=>{
    const lab=id=>q.single?SING[id]||W[id].label:W[id].label;
    const wrong=shuffle(q.pool).sort((a,b)=>use[a]-use[b]).slice(0,2); wrong.forEach(w=>use[w]++);
    const rest=shuffle(wrong); let r=0;
    const opts=[0,1,2].map(k=>{ const id=k===pos[i]?q.ans:rest[r++]; return {t:q.single&&id===q.ans?'a pocket':lab(id),id}; });
    return {...q,opts,ans:pos[i],right:q.ans};
  });
  guessRender();
}
function guessRender(){
  const q=guess.qs[guess.i]; guess.locked=false;
  gRoot.innerHTML=`
  <div class="gbar">
    <div class="round-label">Question ${guess.i+1} of ${guess.qs.length}<span class="chip">${ic('bulb')}Read the clue</span></div>
    ${dotsHTML(guess.qs.length,guess.i,guess.res)}
    <div class="score" id="g-score">${STAR}<span>${guess.score}</span></div>
  </div>
  <div class="gz-stage">
    <div class="tile mystery missing" id="g-tile" aria-label="Mystery picture"><b>?</b></div>
    <div class="clue-card">
      <button class="btn btn-icon say-clue" aria-label="Read the clue aloud" id="g-say">${ic('speaker')}</button>
      <p class="clue-text">${q.clue}</p>
      <p class="clue-q">${q.q}</p>
    </div>
  </div>
  <div class="panel">
    <div class="options" id="g-opts">${q.opts.map((o,k)=>`<button class="opt txt" data-k="${k}" aria-label="${'ABC'[k]}: ${o.t}"><span class="key">${'ABC'[k]}</span>${o.t}</button>`).join('')}</div>
    <div class="feedback" id="g-fb" aria-live="polite"></div>
  </div>`;
  $('#g-say').onclick=()=>say(q.clue+' '+q.q);
  $$('#g-opts .opt').forEach(b=>b.onclick=()=>guessPick(+b.dataset.k));
}
function guessPick(k){
  if(guess.locked) return; guess.locked=true;
  const q=guess.qs[guess.i], ok=k===q.ans, right=q.opts[q.ans], last=guess.i===guess.qs.length-1;
  $$('#g-opts .opt').forEach((b,j)=>{ b.disabled=true; if(j===q.ans) b.classList.add('ok'); else if(j===k) b.classList.add('no'); });

  tile.className='tile mystery reveal'+(ok?'':' wrong'); tile.style.cssText=col(right.id); tile.removeAttribute('aria-label');
  tile.innerHTML=`<img class="ph" src="${IMGS[right.id]}" alt="${right.t}"><span class="cap">${right.t}</span>`;
  guess.res[guess.i]=ok; if(ok){ guess.score++; sfx.good(); burst(tile,wordColor(right.id)); } else sfx.bad();
  say(right.t);
  const sc=$('#g-score'); sc.innerHTML=STAR+`<span>${guess.score}</span>`; if(ok) bumpScore(sc);
  $$('.dots .dot')[guess.i].classList.remove('cur'); $$('.dots .dot')[guess.i].classList.add(ok?'ok':'no');
  const fb=$('#g-fb'); fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML=`<span>${ok?'Great job!':'Oops!'} ${q.lead} ${right.t}.</span><button class="btn btn-primary" id="g-next">${last?'See results':'Next question'}${ic('next')}</button>`;
  const nx=$('#g-next'); nx.onclick=()=>{ if(last) guessEnd(); else { guess.i++; guessRender(); } }; nx.focus();

/* ---------- 3. Fill the gap ---------- */
const GAPSETS=[
 {bank:[{t:'sunglasses',id:'sunglasses'},{t:'pocket',id:'pocket'},{t:'comfortable',id:'comfortable'}],rows:[
   {pre:"She wears dark",post:"on a sunny day.",ans:'sunglasses'},
   {pre:"My key is in my jacket",post:".",ans:'pocket'},
   {pre:"This big sofa is so",post:"!",ans:'comfortable'}]},
 {bank:[{t:'stripes',id:'stripes'},{t:'sneakers',id:'sneakers'},{t:'plain',id:'plain'}],rows:[
   {pre:"Her sweater has red and blue",post:".",ans:'stripes'},
   {pre:"Tom is late! He puts on his",post:".",ans:'sneakers'},
   {pre:"I like",post:"T-shirts with no pictures.",ans:'plain'}]},
 {bank:[{t:'polka dots',id:'polka'},{t:'leggings',id:'leggings'},{t:'bracelets',id:'bracelets'}],rows:[
   {pre:"The clown's pants have big red",post:".",ans:'polka'},
   {pre:"I wear warm",post:"under my skirt.",ans:'leggings'},
   {pre:"Grandma's gold",post:"jingle on her arm.",ans:'bracelets'}]}
];
const gap={set:0,score:0,res:[],started:false,selChip:null,selBlank:null,busy:false,done:[],miss:[],bank:[],sets:[]};
const pRoot=$('#gap-root');
const gapTotal=()=>GAPSETS.reduce((n,s)=>n+s.rows.length,0);
const lead=r=>r.post.match(/^[.,!?]*/)[0], rest=r=>r.post.slice(lead(r).length).trim();
function gapStart(){   // new play: sets come in a new order and the sentences inside each set are mixed too
  gap.set=0; gap.score=0; gap.started=true;
  gap.sets=shuffle(GAPSETS).map(S=>({bank:S.bank,rows:shuffle(S.rows)})); gapRender(); }
function shuffledBank(S){   // word bank in a random order that never matches the order of the sentences
  const ans=S.rows.map(r=>r.ans).join(); let b; do{ b=shuffle(S.bank); }while(b.map(x=>x.id).join()===ans); return b; }
function gapRender(){
  const S=gap.sets[gap.set]; gap.bank=shuffledBank(S); gap.selChip=null; gap.selBlank=null; gap.busy=false; gap.done=S.rows.map(()=>false); gap.miss=S.rows.map(()=>false); gap.res=[];
  pRoot.innerHTML=`
  <div class="gbar">
    <div class="round-label">Set ${gap.set+1} of ${GAPSETS.length}<span class="chip">${ic('pencil')}Tap a word, then tap a gap</span></div>
    ${dotsHTML(S.rows.length,-1,gap.res)}
    <div class="score" id="p-score">${STAR}<span>${gap.score}</span></div>
  </div>
  <div class="bank"><span class="bank-label">Word bank</span>${gap.bank.map((b,k)=>`<button class="wchip" data-k="${k}" style="${col(b.id)}">${b.t}</button>`).join('')}</div>
  <div class="sheet">${S.rows.map((r,i)=>`<div class="srow" data-i="${i}"><span class="num">${i+1}</span>
    <p class="stext">${r.pre} <span class="nw"><button class="blank" data-i="${i}" aria-label="Gap ${i+1}"></button>${lead(r)}</span>${rest(r)?' '+rest(r):''}</p><span class="thumb"></span></div>`).join('')}</div>
  <div class="feedback" id="p-fb" aria-live="polite"></div>`;
  $$('.wchip',pRoot).forEach(b=>b.onclick=()=>gapChip(+b.dataset.k));
  $$('.blank',pRoot).forEach(b=>b.onclick=()=>gapBlank(+b.dataset.i));
}
function gapPaintSel(){
  $$('.wchip',pRoot).forEach((b,k)=>b.classList.toggle('sel',gap.selChip===k));
  $$('.blank',pRoot).forEach((b,i)=>b.classList.toggle('active',gap.selBlank===i));
}
function gapChip(k){
  if(gap.busy) return; const chip=$$('.wchip',pRoot)[k]; if(chip.classList.contains('used')) return;
  sfx.flip(); $('#p-fb').textContent='';
  if(gap.selBlank!==null){ gapPlace(k,gap.selBlank); return; }
  gap.selChip=gap.selChip===k?null:k; gapPaintSel();
}
function gapBlank(i){
  if(gap.busy||gap.done[i]) return; sfx.flip(); $('#p-fb').textContent='';
  if(gap.selChip!==null){ gapPlace(gap.selChip,i); return; }
  gap.selBlank=gap.selBlank===i?null:i; gapPaintSel();
}
function gapPlace(k,i){
  const S=gap.sets[gap.set], b=gap.bank[k], r=S.rows[i], blank=$$('.blank',pRoot)[i], chip=$$('.wchip',pRoot)[k], fb=$('#p-fb');
  gap.selChip=null; gap.selBlank=null; gapPaintSel();
  blank.textContent=b.t;
  if(b.id===r.ans){
    blank.classList.add('filled'); blank.style.cssText=col(b.id); blank.disabled=true;
    chip.classList.add('used'); chip.disabled=true; gap.done[i]=true;
    const row=$$('.srow',pRoot)[i]; row.style.cssText=col(b.id); row.classList.add('done'); burst(blank,wordColor(b.id),12);
    const first=!gap.miss[i]; gap.res[i]=first; if(first){ gap.score++; const sc=$('#p-score'); sc.innerHTML=STAR+`<span>${gap.score}</span>`; bumpScore(sc); }
    $$('.dots .dot',pRoot)[i].classList.add(first?'ok':'no');
    const th=$$('.thumb',pRoot)[i]; th.style.cssText=col(r.ans); th.innerHTML=`<img src="${IMGS[r.ans]}" alt="">`;
    sfx.good(); say(`${r.pre} ${b.t}${lead(r)?'':' '}${r.post}`);
    if(gap.done.every(Boolean)){
      const last=gap.set===gap.sets.length-1;
      fb.className='feedback good';
      fb.innerHTML=`<span>Great job! ${last?'All done.':'Set '+(gap.set+1)+' is done.'}</span><button class="btn btn-primary" id="p-next">${last?'See results':'Next set'}${ic('next')}</button>`;
      const nx=$('#p-next'); nx.onclick=()=>{ if(last) gapEnd(); else { gap.set++; gapRender(); } }; nx.focus();
    }
  } else {
    gap.busy=true; gap.miss[i]=true; blank.classList.add('wrongfill'); sfx.bad();
    fb.className='feedback bad'; fb.textContent='Not quite. Try again!';
    setTimeout(()=>{ blank.classList.remove('wrongfill'); blank.textContent=''; gap.busy=false; },750);
  }
}
function gapEnd(){ const t=gapTotal(); showResult(pRoot,{got:gap.score,total:t,sub:`You got ${gap.score} out of ${t} on the first try.`,perfect:'Perfect!',again:gapStart}); }

/* ---------- 4. What's missing? ---------- */
const WMR=9, WMN=9;   // 9 words, 9 rounds: every word is the missing one exactly once
const wm={round:0,score:0,res:[],words:[],slots:[],optPos:[],dUse:{},lastD:[],started:false,locked:false,cur:null};
const wRoot=$('#wm-root');
// grid: 5 tiles on row 1 (columns 0,2,4,6,8 of a 10-column grid), 4 tiles centred on row 2 (columns 1,3,5,7)
const pos10=i=>i<5?{r:0,c:i*2}:{r:1,c:(i-5)*2+1};
const adj=(a,b)=>{ const p=pos10(a), q=pos10(b); return p.r===q.r ? Math.abs(p.c-q.c)===2 : Math.abs(p.c-q.c)===1; };
function wmStart(){
  wm.round=0; wm.score=0; wm.res=[]; wm.lastD=[]; wm.started=true; wm.dUse=Object.fromEntries(IDS.map(i=>[i,0]));
  wm.words=spacedSeq(IDS,WMR,4); wm.slots=spacedSeq([0,1,2,3,4,5,6,7,8],WMR,3,adj); wm.optPos=spacedSeq([0,1,2],WMR,1);   // slot of the hidden picture and slot of the right answer: both balanced
  wmRound();
}
const tileHTML=(id,kind)=> kind==='pic'
  ? `<div class="tile pic" style="${col(id)}"><img class="ph" src="${IMGS[id]}" alt=""></div>`
  : `<div class="tile word" style="${col(id)}"><span>${W[id].label}</span></div>`;
const MISSING='<div class="tile missing" aria-label="Missing"><b>?</b></div>';
function wmRound(){
  const r=wm.round, kind=r%2===0?'pic':'word', target=wm.words[r], slot=wm.slots[r];
  const others=shuffle(IDS.filter(i=>i!==target)).slice(0,WMN-1);
  const look=shuffle([target,...others]);
  let rest=shuffle(others); const hide=[]; let k=0; for(let s=0;s<WMN;s++) hide.push(s===slot?null:rest[k++]);
  let pool=others.filter(i=>!wm.lastD.includes(i)); if(pool.length<2) pool=others;
  const d=shuffle(pool).sort((a,b)=>wm.dUse[a]-wm.dUse[b]).slice(0,2); d.forEach(x=>wm.dUse[x]++); wm.lastD=d;
  const dd=shuffle(d), op=wm.optPos[r]; let q=0;
  wm.cur={r,kind,target,slot,look,hide,opts:[0,1,2].map(k=>k===op?target:dd[q++])}; wm.locked=false;
  const kinds=Array.from({length:WMR},(_,i)=>i%2===0?'pic':'word');
  const noun=kind==='pic'?'pictures':'words';
  wRoot.innerHTML=`
  <div class="gbar">
    <div class="round-label">Round ${r+1} of ${WMR}<span class="chip">${ic(kind==='pic'?'pic':'words')}${kind==='pic'?'Pictures':'Words'}</span></div>
    ${dotsHTML(WMR,r,wm.res,kinds)}
    <div class="score" id="w-score">${STAR}<span>${wm.score}</span></div>
  </div>
  <div class="stage-wrap" id="w-wrap" data-target="${target}" data-slot="${slot}">
    <div class="stage dealing" id="w-stage">${look.map(id=>tileHTML(id,kind)).join('')}</div>
    <div class="curtain" id="w-curtain" aria-hidden="true"><div class="curtain-inner">${EYES}<p>Close your eyes!</p><div class="count" id="w-count">3</div></div></div>
  </div>
  <div class="panel" id="w-panel">
    <p class="look-copy">Look at the ${noun} carefully. Say them out loud!</p>
    <button class="btn btn-primary" id="w-hide">${ic('eye')}Hide one!</button>
  </div>`;
  setTimeout(()=>{ const s=$('#w-stage'); if(s) s.classList.remove('dealing'); },700);
  $('#w-hide').onclick=wmHide;
}
function wmHide(){
  const c=wm.cur, cur=$('#w-curtain'), cnt=$('#w-count'), btn=$('#w-hide'); btn.disabled=true;
  cur.classList.add('down'); sfx.whoosh(); cnt.textContent='3';
  setTimeout(()=>{ cnt.textContent='2'; sfx.flip(); },750);
  setTimeout(()=>{ cnt.textContent='1'; sfx.flip(); },1500);
  setTimeout(()=>{
    const st=$('#w-stage'); st.innerHTML=c.hide.map(id=>id?tileHTML(id,c.kind):MISSING).join(''); st.classList.add('dealing');
    cur.classList.remove('down');
    setTimeout(()=>{ st.classList.remove('dealing'); wmGuess(); },480);
  },2250);
}
function wmGuess(){
  const c=wm.cur;
  $('#w-panel').innerHTML=`<p class="question">What's missing?</p>
   <div class="options" id="w-opts">${c.opts.map((id,k)=>c.kind==='pic'
     ? `<button class="opt pic" data-k="${k}" aria-label="Choice ${k+1}"><span class="key">${k+1}</span><img class="ph" src="${IMGS[id]}" alt="${W[id].label}"></button>`
     : `<button class="opt txt" data-k="${k}" aria-label="Choice ${k+1}: ${W[id].label}"><span class="key">${k+1}</span>${W[id].label}</button>`).join('')}</div>
   <div class="feedback" id="w-fb" aria-live="polite"></div>`;
  $$('#w-opts .opt').forEach(b=>b.onclick=()=>wmPick(+b.dataset.k));
}
function wmPick(k){
  if(wm.locked) return; wm.locked=true;
  const c=wm.cur, pick=c.opts[k], ok=pick===c.target, last=c.r===WMR-1;
  $$('#w-opts .opt').forEach((b,j)=>{ b.disabled=true; if(c.opts[j]===c.target) b.classList.add('ok'); else if(j===k) b.classList.add('no'); });
  const stage=$('#w-stage'), slotEl=stage.children[c.slot];
  slotEl.outerHTML=tileHTML(c.target,c.kind); const nt=stage.children[c.slot]; nt.classList.add('reveal'); if(!ok) nt.classList.add('wrong');
  wm.res[c.r]=ok; if(ok){ wm.score++; sfx.good(); burst(nt,wordColor(c.target)); } else sfx.bad();
  say(W[c.target].label);
  const sc=$('#w-score'); sc.innerHTML=STAR+`<span>${wm.score}</span>`; if(ok) bumpScore(sc);
  const dots=$$('.dots .dot',wRoot); dots[c.r].classList.remove('cur'); dots[c.r].classList.add(ok?'ok':'no');
  const fb=$('#w-fb'); fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML=`<span>${ok?'Great job!':'Oops!'} It's ${W[c.target].label}.</span><button class="btn btn-primary" id="w-next">${last?'See results':'Next round'}${ic('next')}</button>`;
  const nx=$('#w-next'); nx.onclick=()=>{ if(last) wmEnd(); else { wm.round++; wmRound(); } }; nx.focus();
}
function wmEnd(){ showResult(wRoot,{got:wm.score,total:WMR,sub:`You got ${wm.score} out of ${WMR}.`,perfect:'Perfect memory!',again:wmStart}); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const key=e.key.toLowerCase();
  if(curView==='guess'){ const k='123'.includes(key)&&key?+key-1:'abc'.indexOf(key); if(key.length===1&&k>=0&&k<3){ const b=$$('#g-opts .opt')[k]; if(b&&!b.disabled) b.click(); } }
  if(curView==='wm'){ if('123'.includes(key)&&key.length===1){ const b=$$('#w-opts .opt')[+key-1]; if(b&&!b.disabled) b.click(); } }
});
</script>
</body>
</html>
